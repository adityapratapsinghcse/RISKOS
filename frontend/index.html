<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/riskos-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RiskOS — National Disaster Risk & Relocation Decision Support System (GIS-DSS)</title>
    <meta name="description" content="RiskOS is an authoritative statutory geospatial decision support system (GIS-DSS) for disaster risk assessment, multi-hazard simulation, and safe relocation planning across vulnerable mountain habitations." />
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('riskos-ui-pref-v1');
          if (pref) {
            var data = JSON.parse(pref);
            if (data && data.state && data.state.theme === 'dark') {
              document.documentElement.classList.add('dark');
            } else if (data && data.state && data.state.theme === 'light') {
              document.documentElement.classList.remove('dark');
            }
            if (data && data.state && data.state.lang) {
              document.documentElement.setAttribute('lang', data.state.lang);
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="aria-live-announcer" aria-live="polite" aria-atomic="true" class="sr-only"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
